trigger:
- main

pr: none

pool:
  vmImage: 'ubuntu-latest'

steps:

# Checkout
- checkout: self
  fetchDepth: 0

# Setup Python
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.12'
  displayName: 'Setup Python'

# Install Dependencies
- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
    pip install pytest pytest-cov
  displayName: 'Install Dependencies'

# Run Tests + Generate Coverage
- script: |
    pytest --cov=. --cov-report=xml
  displayName: 'Run Tests and Generate Coverage'

# Prepare SonarQube
- task: SonarQubePrepare@8
  inputs:
    SonarQube: 'sonar-connection'
    scannerMode: 'cli'
    configMode: 'file'
  displayName: 'Prepare SonarQube Analysis'

# IMPORTANT:
# Remove sonar.branch.name automatically injected by Azure DevOps
- bash: |
    python <<'PY'
    import json
    import os

    raw = os.environ.get("SONARQUBE_SCANNER_PARAMS", "{}")
    params = json.loads(raw)

    if "sonar.branch.name" in params:
        del params["sonar.branch.name"]
        print("Removed sonar.branch.name")
    else:
        print("sonar.branch.name was not present")

    value = json.dumps(params, separators=(',', ':'))

    print(
        "##vso[task.setvariable variable=SONARQUBE_SCANNER_PARAMS]"
        + value
    )
    PY
  displayName: 'Remove sonar.branch.name'

# Run SonarQube Analysis
- task: SonarQubeAnalyze@8
  inputs:
    jdkversion: 'JAVA_HOME_17_X64'
  displayName: 'Run SonarQube Analysis'

# Publish Quality Gate
- task: SonarQubePublish@8
  inputs:
    pollingTimeoutSec: '300'
  displayName: 'Publish Quality Gate'
